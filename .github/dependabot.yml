# Weekly dependency updates (issue #2, NFR-SEC-04). Commit messages follow the commit policy
# (docs/05 section 7.5); every update runs the full CI, including the security scans.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/backend, /frontend, /deploy/authelia]
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: ci, include: scope }
