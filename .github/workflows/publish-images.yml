name: Publish images

# Issue #18, ADR-015. After a green CI run on a push to develop or main, build the images and push
# them to GHCR tagged with the immutable commit SHA. This workflow NEVER deploys: rollouts are done
# manually by the operator with the homelab playbook, after the work is tested.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop, main]

permissions:
  contents: read

jobs:
  publish:
    name: publish-images
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push images (immutable SHA tags, never latest)
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for pair in "api:backend" "frontend:frontend"; do
            name="${pair%%:*}"; context="${pair##*:}"
            image="ghcr.io/${owner}/mtg-vault-${name}:${SHA}"
            docker build -t "$image" "$context"
            docker push "$image"
          done
