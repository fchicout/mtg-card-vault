# Security headers for every response of the front-end server (NFR-SEC-06, ADR-009, ADR-016).
# Included by every location because nginx drops inherited add_header lines in a location that
# defines its own. HSTS is set by the TLS terminator (deploy/caddy/Caddyfile), not here.
#
# Content-Security-Policy: no unsafe-inline, no unsafe-eval. The nonce is nginx's $request_id (128
# random bits, new for every request); the same value is written into the page by sub_filter.
# The sha256 allows the one static style Clarity's web components inject (re-derive it when
# Clarity is upgraded: the end-to-end CSP check fails loudly if it changed). Card images may come
# from Scryfall (CON-09); connect-src gets the identity provider with the sign-in feature.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id' 'sha256-gr5XewhdNPOPLeJDnoSdes4w8jVIcX9bO9ms+EfvGE4='; img-src 'self' data: https://cards.scryfall.io; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
