# SonarQube project for the Angular front end (NFR-MNT-01). Run from CI, see .github/workflows/ci.yml.
sonar.projectKey=mtg-vault-frontend
sonar.projectName=MTG Vault - Frontend
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src,e2e
sonar.test.inclusions=**/*.spec.ts,e2e/**/*.ts
sonar.exclusions=src/app/api/**,**/*.spec.ts,e2e/**
# Produced by `npm run test:coverage` (Vitest, lcov reporter).
sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info
sonar.coverage.exclusions=src/app/api/**,**/*.spec.ts,e2e/**,src/main.ts
