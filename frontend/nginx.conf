server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    # Hashed build files never change: cache them for a year.
    location ~* \.(?:js|css|woff2?|svg|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single-page application: unknown paths fall back to index.html. The page carries the CSP
    # nonce, so it is rendered per request and must never be cached.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        sub_filter '__CSP_NONCE__' $request_id;
        sub_filter_once off;
        sub_filter_types text/html;
        try_files $uri $uri/ /index.html;
    }

    # API paths are proxied to the back end.
    location ~ ^/(hello|healthz|readyz|api/) {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
