<div class="main-container">
  <header class="header header-6">
    <div class="branding">
      <span class="title">MTG Card Vault</span>
    </div>
    <div class="header-actions">
      <a href="#" role="button" class="nav-link nav-text" data-testid="theme" (click)="$event.preventDefault(); toggleTheme()">
        <cds-icon [attr.shape]="dark() ? 'sun' : 'moon'" aria-hidden="true"></cds-icon>
        {{ dark() ? 'Light' : 'Dark' }} theme
      </a>
    </div>
  </header>
  <div class="content-container">
    <clr-vertical-nav [clrVerticalNavCollapsible]="false" role="navigation" aria-label="Main navigation">
      <a clrVerticalNavLink routerLink="/vault" routerLinkActive="active">
        <cds-icon clrVerticalNavIcon shape="library"></cds-icon>
        Vault
      </a>
    </clr-vertical-nav>
    <main class="content-area" id="main">
      <router-outlet />
    </main>
  </div>
</div>
