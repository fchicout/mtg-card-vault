<div class="main-container">
  <header class="header header-6">
    <div class="branding">
      <span class="title">MTG Card Vault</span>
    </div>
  </header>
  <div class="content-container">
    <main class="content-area" id="main">
      <h1>Walking skeleton</h1>
      @if (loading()) {
        <span class="spinner spinner-md" role="status">Loading…</span>
      } @else if (failed()) {
        <clr-alert clrAlertType="danger" [clrAlertClosable]="false">
          <clr-alert-item>
            <span class="alert-text" data-testid="error">The API could not be reached.</span>
          </clr-alert-item>
        </clr-alert>
      } @else {
        <div class="card">
          <div class="card-block">
            <p class="card-text" data-testid="greeting">{{ greeting() }}</p>
          </div>
        </div>
      }
    </main>
  </div>
</div>
