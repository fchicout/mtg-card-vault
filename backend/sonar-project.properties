# SonarQube project for the Python back end (NFR-MNT-01). Run from CI, see .github/workflows/ci.yml.
sonar.projectKey=mtg-vault-backend
sonar.projectName=MTG Vault - Backend
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.14
# Produced by `pytest --cov --cov-report=xml` (paths are relative: see [tool.coverage.run]).
sonar.python.coverage.reportPaths=coverage.xml

# Generated or non-source files.
sonar.exclusions=openapi.json
