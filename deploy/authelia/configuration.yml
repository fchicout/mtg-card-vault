# Development Authelia for MTG Card Vault (issue #4, ADR-003). Local only, HTTPS only.
# Secrets are not in this file: deploy/authelia/dev-secrets.sh generates them into ./secrets/ (git-ignored)
# and they reach Authelia through *_FILE environment variables and the `secret` template function.
theme: 'auto'

server:
  address: 'tcp://0.0.0.0:9091/'
  tls:
    certificate: '/secrets/tls.crt'
    key: '/secrets/tls.key'

log:
  level: 'info'

authentication_backend:
  file:
    path: '/config/users_database.yml'

access_control:
  default_policy: 'one_factor'

session:
  cookies:
    - domain: 'localtest.me'
      authelia_url: 'https://auth.localtest.me:9091'
      default_redirection_url: 'https://app.localtest.me:4200'

storage:
  local:
    path: '/data/db.sqlite3'

notifier:
  filesystem:
    filename: '/data/notification.txt'

identity_providers:
  oidc:
    jwks:
      - key_id: 'mtgvault-dev-rs256'
        algorithm: 'RS256'
        use: 'sig'
        key: {{ secret "/secrets/oidc.pem" | mindent 10 "|" | msquote }}
    lifespans:
      access_token: '15m'
      refresh_token: '8h'
      authorize_code: '1m'
      id_token: '15m'
    clients:
      - client_id: 'mtgvault-spa'
        client_name: 'MTG Card Vault (SPA)'
        public: true
        authorization_policy: 'one_factor'
        consent_mode: 'implicit'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://app.localtest.me:4200/callback'
        audience:
          - 'mtgvault-api'
        scopes: ['openid', 'profile', 'email', 'offline_access']
        response_types: ['code']
        grant_types: ['authorization_code', 'refresh_token']
        access_token_signed_response_alg: 'RS256'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'none'
