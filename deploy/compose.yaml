# Minimal skeleton stack (issue #1). The production-grade stack (TLS proxy, Authelia, worker)
# is built in issue #10. Run from this directory: `cp .env.example .env && docker compose up -d --build`.
name: mtgvault

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mtgvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-mtgvault}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mtgvault}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mtgvault}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  db-data:
